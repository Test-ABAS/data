SDG_GOAL: >-
  Section 2: SIDS promote social equity and inclusion
SDG_TARGET: >-
  Target 2.8: Enhance access to free, equitable, and high-quality primary and secondary education, ensuring improved learning outcomes and lifelong educational opportunities, while considering national circumstances
SDG_INDICATOR: >-
  Indicator 2.8.1: Proportion of children and young people (a) in grades 2/3; (b) at the end of primary; and (c) at the end of lower secondary achieving at least a minimum proficiency level in (i) reading and (ii) mathematics, by sex
