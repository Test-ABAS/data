intro_title: The Antigua and Barbuda Agenda for SIDS (ABAS)
intro_body: The Antigua and Barbuda Agenda for Small Island Developing States (ABAS) is a 10-year
  commitment to resilient prosperity for SIDS that was adopted by the UN General Assembly in July 2024.

  The ABAS M&E Framework allows progress towards ABAS to be monitored over time.
