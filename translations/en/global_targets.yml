ECO1-1-title: SIDS manage their debt sustainably by implementing coordinated policies that foster debt financing, debt relief, and debt restructuring
ECO1-2-title: Increase the total amount of official development assistance to SIDS
ECO1-3-title: 1.3 Increase stable and development-conducive foreign direct investment and other private capital flows in SIDS
ECO1-4-title: 1.4 Mobilize additional grant-based resources for SIDS 
ECO1-5-title: 1.5 By 2028, SIDS undertake national productive capacity gap assessments and implement holistic productive capacity development programs
ECO1-6-title: SIDS are supported in designing prioritized trade strategies that increase their export share, encourage full utilization of preferential market access, and promote economic diversification
ECO1-7-title: SIDS achieve higher levels of economic productivity through high value-added and labour-intensive sectors
ECO1-8-title: Enhance SIDS' economic preparedness to engage in e-commerce and digital trade
ECO1-9-title: Expand access to relevant skills development for youth and adults, including technical and vocational training, to support decent work, entrepreneurship, and evolving labor market needs
ECO1-10-title: Ensure the implementation of inclusive, evidence-based national strategies for youth employment
ECO1-11-title: Strengthen and refine sustainable tourism policies to expand job creation
ECO1-12-title: Increase economic benefits for SIDS through the sustainable use of marine resources
ECO1-13-title: Develop quality, reliable, sustainable and resilient transport infrastructure, including regional and transborder infrastructure, to support economic development and human well-being
SOC2-1-title: Achieve universal health coverage to ensure access to affordable, high-quality health-care services and strengthen health systems to protect and improve population health and nutrition
SOC2-2-title: Scale up the recruitment, development, training, and retention of the health workforce in SIDS
SOC2-3-title: Reduce premature mortality from non-communicable diseases and promote mental health
SOC2-4-title: Ensure access to safe, affordable potable water, sanitation, and hygiene for all in SIDS
SOC2-5-title: Enhance health literacy to promote healthy lifestyles and preventive measures addressing non-communicable diseases (NCDs)
SOC2-6-title: Increase development assistance for health, aligning with the national and regional priorities of SIDS
SOC2-7-title: All SIDS ensure access to sufficient, safe, and nutritious food for everyone
SOC2-8-title: Enhance access to free, equitable, and high-quality primary and secondary education, ensuring improved learning outcomes and lifelong educational opportunities, while considering national circumstances
SOC2-9-title: Expand equitable access to affordable, high-quality technical, vocational, and tertiary education - including university—for all women and men, focusing on inclusion and lifelong learning
SOC2-10-title: Ensure responsive, inclusive, participatory, and representative decision-making by developing effective, accountable, and transparent institutions at all levels
SOC2-11-title: Enhance support for SIDS' national and regional institutions to combat transnational crime and violence
SOC2-12-title: Eliminate all forms of discrimination and violence against women and girls
SOC2-13-title: Strengthen and expand nationally appropriate social protection systems and measures
ENV3-1-title: Enhance international cooperation to promote equitable access to resilient, clean, and renewable energy research, technology, and infrastructure in SIDS
ENV3-2-title: Ensure substantial climate finance flows to SIDS from the global target of at least USD 300 billion per year by 2035 for developing country Parties, in line with the NCQG decision 
ENV3-3-title: Accelerate efforts to eliminate all forms of marine pollution, particularly from land-based sources, such as marine debris and nutrient runoff
ENV3-4-title: Scale up scientific knowledge, research capacity, and access to marine technology for SIDS
ENV3-5-title: Ensure and enable that by 2030 at least 30 percent of terrestrial, inland water, and of marine and coastal areas, especially areas of particular importance for biodiversity and ecosystem functions and services, are effectively conserved and managed
ENV3-5-title: Ensure and enable that by 2030 at least 30 percent of terrestrial, inland water, and of marine and coastal areas, especially areas of particular importance for biodiversity and ecosystem functions and services, are effectively conserved and managed
ENV3-6-title: Implement resilient and sustainable agricultural and fisheries practices that strengthen food security, promote nutrition, and enhance livelihoods
ENV3-7-title: Increase the flows of biodiversity-related financial resources to SIDS to implement national biodiversity strategies and action plans
ENV3-8-title: Implement integrated water resources management at all levels to ensure improved water quality
ENV3-9-title: All SIDS are substantially supported in their implementation of country-driven national climate plans, policies, strategies, frameworks and other instruments, in line with their needs and priorities, and reflecting their special circumstances*
ENV3-10-title: Ensure that SIDS are effectively engaged in and implement decisions of the CBD CoP, including the Kunming-Montreal Global Biodiversity Framework*
ENV3-11-title: SIDS have the capacity to ratify and implement the provisions of the Agreement under the United Nations Convention on the Law of the Sea on the Conservation and Sustainable Use of Marine Biological Diversity of Areas beyond National Jurisdiction*
RES4-1-title: Substantially enhance international cooperation with SIDS to provide adequate and sustainable support  for disaster risk reduction, including financial support 
RES4-2-title: Support the design and implementation of comprehensive disaster risk reduction (DRR) strategies and plans in SIDS
RES4-3-title: Enhance the resilience of critical infrastructure systems in SIDS to minimize disruptions to basic services and direct economic losses
RES4-4-title: Promote the systematic collection, management, analysis, and use of disaster data, including risks, impacts, preparedness, and resilience measures, to inform appropriate policy and programmatic actions
RES4-5-title: Protect communities and reduce the number of deaths and people affected by climate-related extreme events and disasters in SIDS
RES4-6-title: Increase the capacity of SIDS for early warning, risk reduction, and management of national and global health risks
RES4-7-title: Reduce disaster risks by enhancing the resilience of freshwater and other water systems
RES4-8-title: Strengthen preparedness and response capacity, enhancing disaster readiness of multi-hazard early warning systems (MHEWS)
DST5-1-title: Enhance capacity-building support for SIDS, significantly increasing the availability of high-quality, timely, disaggregated, and reliable data
DST5-2-title: Increase financing to support the upgrade and strengthening of national data infrastructure and systems, enabling better integration of data into development planning and enhancing the capacity of statistical offices in SIDS, based on their national contexts
DST5-3-title: All SIDS can use science-based and innovative approaches, including the responsible use of AI and geospatial technologies
DST5-4-title: Integrate data into development planning, harnessing the potential of demographic, risk management, and marine data in all SIDS
DST5-5-title: Expand scientific research and innovation while increasing R&D investment
DST5-6-title: Assist SIDS in developing policies and legislation to create an enabling environment for digital transformation at national and regional levels, including through the development of Science, Technology, and Innovation Roadmaps, tailored to national circumstances, priorities, and legislation
DST5-7-title: Enhance digital development in SIDS, strengthen institutional capacity, e-governance, and inclusive digital societies, and ensure their populations have access to reliable digital infrastructure
DEV6-1-title: Create new partnerships and strengthen existing ones, including with international financial institutions and United Nations entities, to mobilize and share knowledge, best practices, expertise, technology, and financial resources in support of SIDS development
DEV6-2-title: Increase international support for implementing effective and targeted capacity-building in SIDS to support the implementation of the Antigua and Barbuda Agenda
DEV6-3-title: Promote South-South Cooperation for SIDS 
DEV6-4-title: By 2027, operationalize the Center of Excellence for SIDS, including the Global Data Hub, Biennial Island Investment Forum and Technology and Innovation Mechanism*
DEV6-5-title: By 2027, operationalize the Debt Sustainability Support Service for SIDS*
FIN7-1-title: 7.1 Increase the representation and participation of SIDS in decision-making within global economic and international financial institutions
